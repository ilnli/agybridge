name: Official CLIs
description: Install pinned official Codex CLI and official Antigravity CLI into a cached prefix and put them on PATH.

inputs:
  codex:
    description: Codex npm version, "latest", or empty for the pinned version
    default: ''

outputs:
  codex:
    description: Resolved Codex version
    value: ${{ steps.versions.outputs.codex }}
  agy:
    description: Resolved Antigravity CLI version
    value: ${{ steps.versions.outputs.agy }}

runs:
  using: composite
  steps:
    - name: Resolve versions
      id: versions
      shell: bash
      env:
        CODEX: ${{ inputs.codex }}
        CODEX_PIN: 0.172.0
      run: |
        CODEX=${CODEX:-$CODEX_PIN}
        resolve() { if [ "$2" = latest ]; then npm view "$1" version; else echo "$2"; fi; }
        codex=$(resolve @openai/codex "$CODEX")
        agy=$(node --input-type=module -e '
          const os = process.platform === "win32" ? "windows" : process.platform === "darwin" ? "darwin" : "linux";
          const arch = process.arch === "arm64" ? "arm64" : "amd64";
          const url = `https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/${os}_${arch}.json`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`Failed to fetch ${url}: ${res.status}`);
          const data = await res.json();
          if (!data.version) throw new Error("Missing version in Antigravity CLI manifest");
          process.stdout.write(String(data.version).trim());
        ')
        echo "codex=$codex" >> "$GITHUB_OUTPUT"
        echo "agy=$agy" >> "$GITHUB_OUTPUT"
        echo "key=official-clis-v2-$RUNNER_OS-$RUNNER_ARCH-$ImageOS-codex$codex-agy$agy" >> "$GITHUB_OUTPUT"
    - name: Restore CLIs
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.agybridge-ci/cli
        key: ${{ steps.versions.outputs.key }}
    - name: Install Codex CLI
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        CODEX: ${{ steps.versions.outputs.codex }}
      run: npm install --global --no-fund --no-audit --prefix "$HOME/.agybridge-ci/cli" "@openai/codex@$CODEX"
    - name: Install Antigravity CLI (Unix)
      if: steps.restore.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        mkdir -p "$HOME/.agybridge-ci/cli/bin"
        curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- --dir "$HOME/.agybridge-ci/cli/bin"
    - name: Install Antigravity CLI (Windows)
      if: steps.restore.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $target = Join-Path $HOME '.agybridge-ci\cli'
        New-Item -ItemType Directory -Force -Path $target | Out-Null
        $installer = Join-Path $env:RUNNER_TEMP 'install-agy.ps1'
        Invoke-RestMethod -Uri 'https://antigravity.google/cli/install.ps1' -OutFile $installer
        & $installer --dir $target --skip-path --skip-aliases
        Remove-Item $installer -Force -ErrorAction SilentlyContinue
    - name: Save CLIs
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.agybridge-ci/cli
        key: ${{ steps.versions.outputs.key }}
    - name: Add CLIs to PATH
      shell: bash
      run: |
        prefix="$HOME/.agybridge-ci/cli"
        if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$prefix" >> "$GITHUB_PATH"; else echo "$prefix/bin" >> "$GITHUB_PATH"; fi
    - name: Add CLIs and Node to the runner's persistent user PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $prefix = Join-Path $HOME '.agybridge-ci\cli'
        $node = Split-Path -Parent (Get-Command node).Source
        $current = [Environment]::GetEnvironmentVariable('Path', 'User')
        $parts = @($prefix, $node) + @(($current -split ';') | Where-Object { $_ })
        [Environment]::SetEnvironmentVariable('Path', (($parts | Select-Object -Unique) -join ';'), 'User')
        $saved = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';'
        if (($saved -notcontains $prefix) -or ($saved -notcontains $node)) { throw 'user PATH was not updated' }
        Write-Output "user PATH: $($saved -join ';')"
    - name: Check CLI versions
      shell: bash
      env:
        DISABLE_AUTOUPDATER: '1'
        CODEX: ${{ steps.versions.outputs.codex }}
        AGY: ${{ steps.versions.outputs.agy }}
      run: |
        codex_seen=$(codex --version); echo "$codex_seen"
        case "$codex_seen" in *"$CODEX"*) ;; *) echo "::error::codex reports '$codex_seen', expected $CODEX"; exit 1;; esac
        agy_seen=$(agy --version); echo "$agy_seen"
        case "$agy_seen" in *"$AGY"*) ;; *) echo "::error::agy reports '$agy_seen', expected $AGY"; exit 1;; esac
